<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DeepSeek for Visual Studio · 架构图</title>
<!--
  说明：本文件是 DeepSeek Chat for Visual Studio 的交互式架构图，单文件、零外部依赖，可离线双击打开。
  数据来源：docs/Architecture.md 与实际目录结构（Services / View / CodeCompletion / Settings / Commands）。
  生成时间：2026-11，由架构分析任务生成。

  操作方式：
    · 拖动空白处 —— 平移画布
    · 滚轮 —— 以鼠标位置为锚点缩放
    · 点击节点右上角圆点 —— 展开 / 折叠该分组的子节点
    · 点击节点 —— 在右侧面板查看职责、文件路径与上下游依赖
    · 顶部搜索框 —— 按类名或职责过滤高亮
-->
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: "Segoe UI", "Microsoft YaHei", Consolas, sans-serif;
  }

  /* 深色为默认主题，浅色由 body.light 覆盖同名变量 */
  body {
    --bg: #1e1e1e;
    --panel: #252526;
    --panel2: #2d2d30;
    --border: #3f3f46;
    --text: #d4d4d4;
    --muted: #8f8f95;
    --accent: #4ec9b0;
    --node-fill: #2a2a2e;
    --edge: #6b6b73;
    --shadow: rgba(0, 0, 0, .45);
    background: var(--bg);
    color: var(--text);
  }

  body.light {
    --bg: #f6f6f7;
    --panel: #ffffff;
    --panel2: #f0f0f2;
    --border: #d8d8dc;
    --text: #24292e;
    --muted: #6a737d;
    --accent: #0b7a68;
    --node-fill: #ffffff;
    --edge: #b6b6bd;
    --shadow: rgba(0, 0, 0, .12);
  }

  /* ── 顶栏 ───────────────────────────────────────────── */
  #toolbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 50px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    z-index: 20;
  }

  #toolbar .title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .3px;
    margin-right: 6px;
    white-space: nowrap;
  }

  #toolbar .title span { color: var(--accent); }

  #search {
    width: 220px;
    height: 30px;
    padding: 0 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--text);
    font-size: 12px;
    outline: none;
  }

  #search:focus { border-color: var(--accent); }

  button {
    height: 30px;
    padding: 0 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--text);
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
  }

  button:hover { border-color: var(--accent); color: var(--accent); }
  button:active { transform: translateY(1px); }

  #stats {
    margin-left: auto;
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }

  /* ── 画布 ───────────────────────────────────────────── */
  #stage {
    position: absolute;
    inset: 50px 0 0 0;
    overflow: hidden;
  }

  #svg {
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
    touch-action: none;
  }

  #svg.dragging { cursor: grabbing; }

  .node-box {
    fill: var(--node-fill);
    stroke-width: 1.5;
    transition: filter .12s;
  }

  .node:hover .node-box { filter: brightness(1.25); }

  .node-label {
    fill: var(--text);
    font-size: 11px;
    text-anchor: middle;
    pointer-events: none;
    font-family: Consolas, "Segoe UI", monospace;
  }

  .node-sub {
    fill: var(--muted);
    font-size: 9px;
    text-anchor: middle;
    pointer-events: none;
  }

  .node.selected .node-box { stroke-width: 3; }
  .node.dim { opacity: .13; }

  /* 方块可拖拽：悬停显示抓手，拖拽中提升亮度与描边 */
  .node-box { cursor: grab; }
  .node.dragging .node-box { cursor: grabbing; stroke-width: 3; filter: brightness(1.6); }
  .node.hit .node-box { filter: brightness(1.5); }
  .node.hit .node-label { fill: var(--accent); font-weight: 600; }

  .edge {
    fill: none;
    stroke: var(--edge);
    stroke-width: 1.4;
    opacity: .9;
  }

  .edge.impl { stroke: #c678dd; stroke-dasharray: 6 4; }
  .edge.call { stroke: #e3b341; stroke-width: 1.6; }
  .edge.data { stroke: #56d4dd; stroke-dasharray: 2 3; stroke-width: 1.4; }
  .edge.dep { stroke: #7ee787; opacity: .8; }
  .edge.dim { opacity: .05; }
  .edge.hit { opacity: 1; stroke-width: 2.4; }

  .toggle { cursor: pointer; }
  .toggle circle { fill: var(--panel2); stroke: var(--border); }
  .toggle text {
    fill: var(--text);
    font-size: 10px;
    text-anchor: middle;
    pointer-events: none;
  }
  .toggle:hover circle { fill: var(--accent); }
  .toggle:hover text { fill: #101010; }

  /* ── 详情面板 ───────────────────────────────────────── */
  #detail {
    position: fixed;
    top: 62px;
    right: 12px;
    width: 330px;
    max-height: calc(100% - 80px);
    overflow: auto;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    box-shadow: 0 6px 24px var(--shadow);
    font-size: 12px;
    line-height: 1.6;
    display: none;
    z-index: 15;
  }

  #detail.open { display: block; }

  #detail h2 {
    margin: 0 0 4px;
    font-size: 14px;
    font-family: Consolas, monospace;
    word-break: break-all;
  }

  #detail .layer-chip {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 10px;
    font-size: 10px;
    margin-bottom: 8px;
  }

  #detail .file {
    font-family: Consolas, monospace;
    font-size: 11px;
    color: var(--muted);
    word-break: break-all;
    margin-bottom: 8px;
  }

  #detail .desc { margin-bottom: 12px; }

  #detail .sect {
    font-size: 11px;
    color: var(--muted);
    margin: 10px 0 4px;
    text-transform: uppercase;
    letter-spacing: .5px;
  }

  #detail a.dep-link {
    display: block;
    padding: 3px 6px;
    border-radius: 4px;
    color: var(--text);
    text-decoration: none;
    font-family: Consolas, monospace;
    font-size: 11px;
  }

  #detail a.dep-link:hover { background: var(--panel2); color: var(--accent); }
  #detail .empty { color: var(--muted); font-size: 11px; }

  /* ── 图例 ───────────────────────────────────────────── */
  #legend {
    position: fixed;
    left: 12px;
    bottom: 12px;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    box-shadow: 0 6px 24px var(--shadow);
    font-size: 11px;
    line-height: 1.5;
    z-index: 15;
    max-width: 260px;
  }

  #legend .row { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
  #legend .swatch { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; }
  #legend .line-swatch { width: 18px; height: 0; border-top-width: 2px; border-top-style: solid; flex: 0 0 auto; }
  #legend .sect { color: var(--muted); margin: 6px 0 3px; font-size: 10px; letter-spacing: .5px; }
</style>
</head>

<div id="toolbar">

</div>

    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // 估算文本像素宽度：中文按 11.5px、其余按 6.4px（与 node-label 的 11px 字号匹配）
  function textWidth(s) {
    var w = 0;
    for (var i = 0; i < s.length; i++) {
      w += /[\u4e00-\u9fff]/.test(s[i]) ? 11.5 : 6.4;
    }
    return w;
  }

  function truncate(s, max) {
    if (textWidth(s) <= max) return s;
    var out = '';
    var w = 0;
    for (var i = 0; i < s.length; i++) {
      var cw = /[\u4e00-\u9fff]/.test(s[i]) ? 11.5 : 6.4;
      if (w + cw > max - 9) break;
      out += s[i];
      w += cw;
    }
    return out + '…';
  }

  // 某节点的后代总数，用于折叠徽标显示隐藏数量
  function countDescendants(id) {
    var kids = CHILDREN[id];
    if (!kids) return 0;
    var total = 0;
    kids.forEach(function (k) {
      total += 1 + countDescendants(k);
    });
    return total;
  }

  // 节点可见 <=> 自身及所有祖先都未被折叠
  function visibleIds() {
    var out = [];
    NODES.forEach(function (n) {
      var p = n.parent;
      var ok = true;
      while (p) {
        if (COLLAPSED.has(p)) { ok = false; break; }
        var pn = MAP[p];
        p = pn ? pn.parent : null;
      }
      if (ok) out.push(n.id);
    });
    return out;
  }

  // 为尚未布点的节点生成初始坐标：优先紧贴父节点，否则撒在中心周围的圆环上
  function ensurePositions(ids) {
    var added = false;
    ids.forEach(function (id) {
      if (POS.has(id)) return;
      added = true;
      var n = MAP[id];
      var x, y;
      var pp = n.parent ? POS.get(n.parent) : null;
      if (pp) {
        // 展开出来的子节点紧贴父节点附近，避免全图重排
        x = pp.x + (Math.random() - 0.5) * 420;
        y = pp.y + 110 + Math.random() * 180;
      } else {
        var r = 300 + Math.random() * 700;
        var t = Math.random() * Math.PI * 2;
        x = Math.cos(t) * r;
        y = Math.sin(t) * r;
      }
      POS.set(id, { x: x, y: y });
      VEL.set(id, { x: 0, y: 0 });
    });
    return added;
  }

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  // 一次力导向迭代：斥力（矩形归一化）+ 连线弹簧 + 向心力，最后按温度缩放位移
  function simulate(ids, alphaScale) {
    var count = ids.length;
    var i, j;

    var pts = new Array(count);
    var vels = new Array(count);
    for (i = 0; i < count; i++) {
      var p0 = POS.get(ids[i]);
      pts[i] = { x: p0.x + NODE_W / 2, y: p0.y + NODE_H / 2 };
      vels[i] = VEL.get(ids[i]);
      vels[i].x = 0;
      vels[i].y = 0;
    }

    // 用无原型对象做 id → 下标映射，避开 Object 原型链上的同名属性
    var indexOf = Object.create(null);
    for (i = 0; i < count; i++) indexOf[ids[i]] = i;

    // 统计可见节点的连线条数：零度节点没有弹簧约束，会被斥力推到最外圈单独漂着，
    // 后面给它更强的向心力兜底（以后再漏补边也不会出现孤立散点）。
    var deg = Object.create(null);
    for (i = 0; i < count; i++) deg[ids[i]] = 0;
    for (i = 0; i < EDGES.length; i++) {
      var de = EDGES[i];
      if (deg[de.from] !== undefined) deg[de.from]++;
      if (deg[de.to] !== undefined) deg[de.to]++;
    }

    // 斥力（各向同性）：真实像素距离的平方反比，500px 处约 3.6 px/帧。
    // 再叠一条矩形分离力：两个方块的 AABB 一旦相交，就沿「穿透更浅」的轴推开，
    // 否则纯平方反比在近处衰减过猛，方块会频繁互相压住导致文字不可读。
    for (i = 0; i < count; i++) {
      var a = pts[i];
      for (j = i + 1; j < count; j++) {
        var b = pts[j];
        var dx = b.x - a.x;
        var dy = b.y - a.y;
        var dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < 1) {
          // 完全重合时方向无意义，给一个随机微方向把两点掰开
          dx = (Math.random() - 0.5) * 2;
          dy = (Math.random() - 0.5) * 2;
          dist = Math.sqrt(dx * dx + dy * dy) || 1;
        }

        var ux = dx / dist;
        var uy = dy / dist;
        var rep = REPULSION_PX / (dist * dist);
        vels[i].x -= ux * rep;
        vels[i].y -= uy * rep;
        vels[j].x += ux * rep;
        vels[j].y += uy * rep;

        // 矩形分离：取最小平移向量（沿重叠更浅的轴）把两者推开
        var ox = (NODE_W + 40) - Math.abs(dx);
        var oy = (NODE_H + 26) - Math.abs(dy);
        if (ox > 0 && oy > 0) {
          if (ox < oy) {
            var sx = (dx >= 0 ? -1 : 1) * ox * SEPARATION;
            vels[i].x += sx;
            vels[j].x -= sx;
          } else {
            var sy = (dy >= 0 ? -1 : 1) * oy * SEPARATION;
            vels[i].y += sy;
            vels[j].y -= sy;
          }
        }
      }
    }

    // 连线弹簧：data 边用更长的理想长度，把数据流推到外围
    for (i = 0; i < EDGES.length; i++) {
      var e = EDGES[i];
      var ia = indexOf[e.from];
      var ib = indexOf[e.to];
      if (ia === undefined || ib === undefined) continue;

      var pa = pts[ia];
      var pb = pts[ib];
      var dx = pb.x - pa.x;
      var dy = pb.y - pa.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 1e-3) continue;
      var rest = (e.type === 'data') ? SPRING_LEN_DATA : SPRING_LEN;
      var stretch = (dist - rest) / dist * SPRING_STRENGTH;
      var fx = dx * stretch;
      var fy = dy * stretch;
      vels[ia].x += fx;
      vels[ia].y += fy;
      vels[ib].x -= fx;
      vels[ib].y -= fy;
    }

    // 向心力 + 阻尼 + 应用位移
    for (i = 0; i < count; i++) {
      var id = ids[i];
      var v = vels[i];
      var pt = pts[i];

      if (FIXED.has(id)) {
        var f = FIXED.get(id);
        var np = POS.get(id);
        np.x = f.x;
        np.y = f.y;
        v.x = 0;
        v.y = 0;
        continue;
      }

      // 零度节点额外加强向心，避免它被斥力推到外围变成孤立散点
      var pull = (deg[id] === 0) ? CENTER_STRENGTH * 3 : CENTER_STRENGTH;
      v.x -= pt.x * pull;
      v.y -= pt.y * pull;
      v.x *= DAMPING;
      v.y *= DAMPING;

      var node = POS.get(id);
      node.x += clamp(v.x * alphaScale, -MAX_STEP, MAX_STEP);
      node.y += clamp(v.y * alphaScale, -MAX_STEP, MAX_STEP);
    }
  }

  // 停止当前动画循环
  function stopLoop() {
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
  }

  // 提高温度并启动循环：用于展开新节点、拖拽让位等局部松弛
  function heat(a) {
    if (frozen) return;
    alpha = Math.max(alpha, a);
    if (!rafId) rafId = requestAnimationFrame(tick);
  }

  // 动画循环：每帧迭代一次并重绘，温度衰减到阈值后停住，避免空转耗 CPU
  function tick() {
    rafId = 0;
    if (alpha <= MIN_ALPHA || frozen) {
      alpha = 0;
      render();
      return;
    }
    simulate(visibleIds(), alpha);
    alpha *= ALPHA_DECAY;
    render();
    rafId = requestAnimationFrame(tick);
  }

  // 预热：连续迭代但不渲染，让首屏直接呈现收敛后的布局，而不是看到节点爆炸散开
  function warmup(iterations) {
    var ids = visibleIds();
    ensurePositions(ids);
    for (var k = 0; k < iterations; k++) simulate(ids, 1);
    alpha = 0;
  }

  // 重新布局：清空全部坐标后重新撒点并充分预热
  function relayout() {
    stopLoop();
    POS.clear();
    VEL.clear();
    FIXED.clear();
    frozen = false;
    var fb = document.getElementById('btn-freeze');
    if (fb) fb.textContent = '固定布局';
    warmup(520);
    render();
    fit();
  }

  // 计算连线两端落在方块边框上的锚点：水平距离明显更大时走左右边，否则走上下边，
  // 网状布局下方块四散，固定「底→顶」会让连线穿过方块内部。
  function borderAnchor(fromPos, toPos) {
    var fx = fromPos.x + NODE_W / 2;
    var fy = fromPos.y + NODE_H / 2;
    var tx = toPos.x + NODE_W / 2;
    var ty = toPos.y + NODE_H / 2;
    var dx = tx - fx;
    var dy = ty - fy;

    if (Math.abs(dx) > Math.abs(dy) * 1.6) {
      return { x: fx + (dx > 0 ? NODE_W / 2 : -NODE_W / 2), y: fy, out: { x: dx > 0 ? 1 : -1, y: 0 } };
    }
    return { x: fx, y: fy + (dy > 0 ? NODE_H / 2 : -NODE_H / 2), out: { x: 0, y: dy > 0 ? 1 : -1 } };
  }

  function edgePath(a, b) {
    var from = borderAnchor(a, b);
    var to = borderAnchor(b, a);
    // 控制点沿各自出射方向外推，形成平滑弧线而不是一条直线
    var bend = Math.min(120, Math.max(40, Math.sqrt((to.x - from.x) * (to.x - from.x) + (to.y - from.y) * (to.y - from.y)) * 0.28));
    var c1x = from.x + from.out.x * bend;
    var c1y = from.y + from.out.y * bend;
    var c2x = to.x + to.out.x * bend;
    var c2y = to.y + to.out.y * bend;
    return 'M' + from.x + ',' + from.y +
           ' C' + c1x + ',' + c1y + ' ' + c2x + ',' + c2y + ' ' + to.x + ',' + to.y;
  }

  function matchesQuery(n) {
    if (!query) return false;
    var q = query.toLowerCase();
    return (n.label && n.label.toLowerCase().indexOf(q) >= 0) ||
           (n.desc && n.desc.toLowerCase().indexOf(q) >= 0) ||
           (n.file && n.file.toLowerCase().indexOf(q) >= 0);
  }

  function render() {
    var ids = visibleIds();
    var visSet = new Set(ids);
    // 折叠展开后可能出现新节点：补上初始坐标并触发一次局部松弛
    if (ensurePositions(ids)) heat(0.6);
    var pos = POS;

    var parts = [];
    var visEdges = 0;
    var hitEdge = 0;

    // 先画连线，保证节点覆盖在其上
    EDGES.forEach(function (e) {
      if (!visSet.has(e.from) || !visSet.has(e.to)) return;
      var a = pos.get(e.from);
      var b = pos.get(e.to);
      if (!a || !b) return;
      visEdges++;

      var d = edgePath(a, b);

      var cls = 'edge ' + e.type;
      if (query) {
        var hit = matchesQuery(MAP[e.from]) || matchesQuery(MAP[e.to]);
        cls += hit ? ' hit' : ' dim';
        if (hit) hitEdge++;
      }
      parts.push('<path class="' + cls + '" d="' + d + '" marker-end="url(#m-' + e.type + ')"></path>');
    });

    // 再画节点
    NODES.forEach(function (n) {
      if (!visSet.has(n.id)) return;
      var p = pos.get(n.id);
      if (!p) return;

      var color = LAYER_COLOR[n.layer] || '#888';
      var isGroup = !!CHILDREN[n.id];
      var isCollapsed = COLLAPSED.has(n.id);

      var cls = 'node';
      if (n.id === selectedId) cls += ' selected';
      if (n.id === draggingId) cls += ' dragging';
      if (query) cls += matchesQuery(n) ? ' hit' : ' dim';

      var label = truncate(n.label, NODE_W - 16);
      var sub = LAYER_NAME[n.layer] + (isGroup ? ' · 分组' : '');

      var s = '<g class="' + cls + '" data-id="' + n.id + '" transform="translate(' + p.x + ',' + p.y + ')">';
      s += '<rect class="node-box" width="' + NODE_W + '" height="' + NODE_H + '" rx="9" style="stroke:' + color + '"></rect>';
      s += '<text class="node-label" x="' + (NODE_W / 2) + '" y="21">' + esc(label) + '</text>';
      s += '<text class="node-sub" x="' + (NODE_W / 2) + '" y="35">' + esc(sub) + '</text>';
      s += '<title>' + esc(n.label) + ' — ' + esc(n.desc) + '</title>';

      if (isGroup) {
        var badge = isCollapsed ? '+' + countDescendants(n.id) : '−';
        s += '<g class="toggle" data-toggle="' + n.id + '">';
        s += '<circle cx="' + (NODE_W - 14) + '" cy="14" r="9"></circle>';
        s += '<text x="' + (NODE_W - 14) + '" y="18">' + badge + '</text>';
        s += '</g>';
      }

      s += '</g>';
      parts.push(s);
    });

    viewport.innerHTML = parts.join('');

    stats.textContent = '可见节点 ' + ids.length + ' / ' + NODES.length +
      '　连线 ' + visEdges + ' / ' + EDGES.length +
      (query ? '　命中连线 ' + hitEdge : '');
  }

  // ─────────────────────────────────────────────────────────────
  // 三、视图变换：平移、缩放、适配
  // ─────────────────────────────────────────────────────────────

  function applyView() {
    viewport.setAttribute('transform', 'translate(' + view.x + ',' + view.y + ') scale(' + view.k + ')');
  }

  function zoomAt(cx, cy, factor) {
    var nk = Math.min(3, Math.max(0.15, view.k * factor));
    var real = nk / view.k;
    view.x = cx - (cx - view.x) * real;
    view.y = cy - (cy - view.y) * real;
    view.k = nk;
    applyView();
  }

  function fit() {
    var ids = visibleIds();
    if (!ids.length) return;
    var pos = POS;

    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    ids.forEach(function (id) {
      var p = pos.get(id);
      if (!p) return;
      minX = Math.min(minX, p.x);
      minY = Math.min(minY, p.y);
      maxX = Math.max(maxX, p.x + NODE_W);
      maxY = Math.max(maxY, p.y + NODE_H);
    });
    if (!isFinite(minX)) return;

    var rect = stage.getBoundingClientRect();
    var bw = maxX - minX;
    var bh = maxY - minY;
    var k = Math.min(rect.width / (bw + 140), rect.height / (bh + 140), 1.15);
    k = Math.max(0.15, k);

    view.k = k;
    view.x = rect.width / 2 - (minX + bw / 2) * k;
    view.y = rect.height / 2 - (minY + bh / 2) * k;
    applyView();
  }

  // 把某个节点平移到视口中心，用于搜索命中后定位
  function centerOn(id) {
    var p = POS.get(id);
    if (!p) return;
    var rect = stage.getBoundingClientRect();
    view.x = rect.width / 2 - (p.x + NODE_W / 2) * view.k;
    view.y = rect.height / 2 - (p.y + NODE_H / 2) * view.k;
    applyView();
  }

  // ─────────────────────────────────────────────────────────────
  // 四、详情面板
  // ─────────────────────────────────────────────────────────────

  function depLinks(ids, emptyText) {
    if (!ids.length) return '<div class="empty">' + emptyText + '</div>';
    return ids.map(function (id) {
      var n = MAP[id];
      return '<a class="dep-link" href="#" data-jump="' + id + '">' + esc(n ? n.label : id) + '</a>';
    }).join('');
  }

  function select(id) {
    selectedId = id;
    var n = MAP[id];
    if (!n) {
      detail.classList.remove('open');
      render();
      return;
    }

    var outs = [];
    var ins = [];
    EDGES.forEach(function (e) {
      if (e.from === id && outs.indexOf(e.to) < 0) outs.push(e.to);
      if (e.to === id && ins.indexOf(e.from) < 0) ins.push(e.from);
    });

    var color = LAYER_COLOR[n.layer] || '#888';
    var html = '';
    html += '<h2>' + esc(n.label) + '</h2>';
    html += '<div class="layer-chip" style="background:' + color + '22;border:1px solid ' + color + ';color:' + color + '">' +
            LAYER_NAME[n.layer] + ' · L' + n.layer + '</div>';
    html += '<div class="file">' + esc(n.file || '（无独立文件）') + '</div>';
    html += '<div class="desc">' + esc(n.desc || '') + '</div>';

    if (CHILDREN[id]) {
      html += '<div class="sect">包含 ' + CHILDREN[id].length + ' 个子项</div>';
      html += depLinks(CHILDREN[id], '');
    }

    html += '<div class="sect">依赖（下游 ' + outs.length + '）</div>';
    html += depLinks(outs, '无出向依赖');
    html += '<div class="sect">被依赖（上游 ' + ins.length + '）</div>';
    html += depLinks(ins, '无入向依赖');

    detail.innerHTML = html;
    detail.classList.add('open');
    render();
  }

  // ─────────────────────────────────────────────────────────────
  // 五、事件绑定
  // ─────────────────────────────────────────────────────────────

  // 交互模式：node=拖拽单个方块，pan=平移画布。两者互斥，避免拖方块时手一斜就跑偏整个画布。
  var mode = null;
  var dragStart = null;
  var nodeDrag = null;
  var draggingId = null; // 当前被拖的节点 id，render 时用来保留 .dragging 样式
  var moved = false;

  // 屏幕坐标 → 画布坐标（先去掉画布平移与缩放，否则缩放后拖动会跟手不一致）
  function toCanvas(clientX, clientY) {
    var rect = svg.getBoundingClientRect();
    return {
      x: (clientX - rect.left - view.x) / view.k,
      y: (clientY - rect.top - view.y) / view.k
    };
  }

  svg.addEventListener('pointerdown', function (ev) {
    if (ev.button !== 0) return;

    moved = false;
    // 折叠圆点交给 click 单独处理：一旦在这里启动平移并 setPointerCapture，
    // 随后的 click 目标会被重定向到 <svg>，closest('[data-toggle]') 就会失配。
    var toggleHit = ev.target.closest ? ev.target.closest('[data-toggle]') : null;
    if (toggleHit) return;
    var nd = ev.target.closest ? ev.target.closest('[data-id]') : null;
    var tg = ev.target.closest ? ev.target.closest('[data-toggle]') : null;

    // 命中方块本体（且不是折叠圆点）→ 拖拽该方块
    if (nd && !tg) {
      var id = nd.getAttribute('data-id');
      var p = POS.get(id);
      if (!p) return;

      var pt = toCanvas(ev.clientX, ev.clientY);
      mode = 'node';
      draggingId = id;
      // 记录指针相对方块左上角的偏移，拖动时方块不会“跳到指针中心”
      nodeDrag = { id: id, offX: pt.x - p.x, offY: pt.y - p.y };

      // 钉住被拖方块，并提高温度让周围节点主动让位
      FIXED.set(id, { x: p.x, y: p.y });
      svg.classList.add('dragging');
      svg.setPointerCapture(ev.pointerId);
      heat(0.45);
      return;
    }

    // 其他位置 → 平移画布
    mode = 'pan';
    dragStart = { x: ev.clientX, y: ev.clientY, vx: view.x, vy: view.y };
    svg.classList.add('dragging');
    svg.setPointerCapture(ev.pointerId);
  });

  svg.addEventListener('pointermove', function (ev) {
    if (mode === 'node' && nodeDrag) {
      var pt = toCanvas(ev.clientX, ev.clientY);
      var nx = pt.x - nodeDrag.offX;
      var ny = pt.y - nodeDrag.offY;
      var np = POS.get(nodeDrag.id);
      if (!np) return;

      np.x = nx;
      np.y = ny;
      FIXED.set(nodeDrag.id, { x: nx, y: ny });
      moved = true;

      // 已有动画循环时由 tick 完成重绘；「固定布局」下没有循环，需要手动重绘
      if (frozen) render(); else heat(0.45);
      return;
    }

    if (mode === 'pan' && dragStart) {
      var dx = ev.clientX - dragStart.x;
      var dy = ev.clientY - dragStart.y;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
      view.x = dragStart.vx + dx;
      view.y = dragStart.vy + dy;
      applyView();
    }
  });

  svg.addEventListener('pointerup', function (ev) {
    if (mode === 'node' && nodeDrag) {
      // 松手后解除固定但保留当前位置：让力模型把邻居推开、自己小幅归位，
      // 而不是永久钉死在可能与其它方块重叠的位置。
      FIXED.delete(nodeDrag.id);
      nodeDrag = null;
      draggingId = null;
      mode = null;
      svg.classList.remove('dragging');
      try { svg.releasePointerCapture(ev.pointerId); } catch (e) { /* 指针已释放时忽略 */ }
      if (frozen) render(); else heat(0.3);
      return;
    }

    if (mode === 'pan') {
      mode = null;
      dragStart = null;
      svg.classList.remove('dragging');
      try { svg.releasePointerCapture(ev.pointerId); } catch (e) { /* 指针已释放时忽略 */ }
    }
  });

  svg.addEventListener('pointercancel', function () {
    if (nodeDrag) FIXED.delete(nodeDrag.id);
    mode = null;
    nodeDrag = null;
    draggingId = null;
    dragStart = null;
    svg.classList.remove('dragging');
  });

  // 缩放：以鼠标位置为锚点
  svg.addEventListener('wheel', function (ev) {
    ev.preventDefault();
    var rect = svg.getBoundingClientRect();
    var cx = ev.clientX - rect.left;
    var cy = ev.clientY - rect.top;
    zoomAt(cx, cy, ev.deltaY < 0 ? 1.12 : 1 / 1.12);
  }, { passive: false });

  // 点击：优先命中折叠按钮，其次节点，最后空白取消选中
  svg.addEventListener('click', function (ev) {
    if (moved) { moved = false; return; }

    // 优先用 composedPath：即使 target 因指针捕获被重定向，也能定位到折叠圆点。
    var tg = null;
    var path = ev.composedPath ? ev.composedPath() : [];
    for (var pi = 0; pi < path.length; pi++) {
      if (path[pi] && path[pi].getAttribute && path[pi].getAttribute('data-toggle')) { tg = path[pi]; break; }
    }
    if (!tg && ev.target.closest) tg = ev.target.closest('[data-toggle]');
    if (tg) {
      var tid = tg.getAttribute('data-toggle');
      if (COLLAPSED.has(tid)) COLLAPSED.delete(tid); else COLLAPSED.add(tid);
      render();
      return;
    }

    var nd = ev.target.closest('[data-id]');
    if (nd) {
      select(nd.getAttribute('data-id'));
      return;
    }

    selectedId = null;
    detail.classList.remove('open');
    render();
  });

  // 详情面板内的依赖跳转
  detail.addEventListener('click', function (ev) {
    var a = ev.target.closest('[data-jump]');
    if (!a) return;
    ev.preventDefault();
    var id = a.getAttribute('data-jump');

    // 目标可能被折叠隐藏，先展开其所有祖先再定位
    var p = MAP[id] ? MAP[id].parent : null;
    while (p) {
      COLLAPSED.delete(p);
      p = MAP[p] ? MAP[p].parent : null;
    }
    select(id);
    centerOn(id);
  });

  // 搜索
  var searchInput = document.getElementById('search');
  searchInput.addEventListener('input', function () {
    query = searchInput.value.trim();
    render();
  });

  searchInput.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter') return;
    var first = null;
    for (var i = 0; i < NODES.length; i++) {
      if (matchesQuery(NODES[i])) { first = NODES[i].id; break; }
    }
    if (!first) return;
    // 命中节点可能在折叠子树里，逐级展开祖先
    var p = MAP[first].parent;
    while (p) {
      COLLAPSED.delete(p);
      p = MAP[p] ? MAP[p].parent : null;
    }
    select(first);
    centerOn(first);
  });

  // 工具栏
  document.getElementById('btn-expand').addEventListener('click', function () {
    COLLAPSED.clear();
    render();
  });

  document.getElementById('btn-collapse').addEventListener('click', function () {
    Object.keys(CHILDREN).forEach(function (id) { COLLAPSED.add(id); });
    render();
  });

  document.getElementById('btn-relayout').addEventListener('click', function () {
    relayout();
  });

  document.getElementById('btn-freeze').addEventListener('click', function () {
    frozen = !frozen;
    if (frozen) {
      stopLoop();
      alpha = 0;
    } else {
      heat(0.6);
    }
    this.textContent = frozen ? '恢复模拟' : '固定布局';
  });

  document.getElementById('btn-fit').addEventListener('click', function () { render(); fit(); });

  document.getElementById('btn-zoom-in').addEventListener('click', function () {
    var rect = stage.getBoundingClientRect();
    zoomAt(rect.width / 2, rect.height / 2, 1.25);
  });

  document.getElementById('btn-zoom-out').addEventListener('click', function () {
    var rect = stage.getBoundingClientRect();
    zoomAt(rect.width / 2, rect.height / 2, 1 / 1.25);
  });

  var themeBtn = document.getElementById('btn-theme');
  themeBtn.addEventListener('click', function () {
    var light = document.body.classList.toggle('light');
    document.body.classList.toggle('dark', !light);
    themeBtn.textContent = light ? '深色' : '浅色';
  });

  // 图例：按层生成
  var legendLayers = document.getElementById('legend-layers');
  legendLayers.innerHTML = LAYERS.map(function (l) {
    return '<div class="row"><span class="swatch" style="background:' + l.color + '"></span>' +
           l.n + '. ' + l.name + '</div>';
  }).join('');

  // 首次：先预热力模拟再渲染，避免用户看到节点从原点爆开的过程
  warmup(520);
  render();
  fit();

  // 视口尺寸变化时只调整画布，不重置用户当前的缩放
  window.addEventListener('resize', function () {
    applyView();
  });
})();
</script>
</body>
</html>
