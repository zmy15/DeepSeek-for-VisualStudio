name: Create Release (手动发版)

# 一次手动触发 = 一个 tag + 一个 Release + 两个 VSIX：
#   1. 标准版：直接在 master 上构建
#   2. No-Local-OCR 版：在同一工作区运行 tools/remove-paddleocr.py 后再构建一次
# 两个包共享同一份版本号、同一个 tag 与同一个 Release，不再需要选择 variant，
# 也不再依赖 no-local-paddleocr 分支（避免版本号提交与分支同步之间的竞态）。

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不含 v 前缀，例如 1.1.14）'
        required: true
        type: string
      release_description:
        description: '版本描述（可选，将显示在 Release 说明开头；留空则仅显示自动生成的更新日志）。注意：GitHub 输入框不支持多行，请用字面量 \n 表示换行，例如：修复了A\n新增了B'
        required: false
        type: string

permissions:
  contents: write

# 同一次发版流程内串行；防止两次手动发版并发时版本号提交与 tag 互相覆盖
concurrency:
  group: manual-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
    - name: 检出 master 分支
      uses: actions/checkout@v4
      with:
        ref: master
        fetch-depth: 0

    - name: 计算 tag 名称
      id: tag
      shell: pwsh
      run: |
        $version = "${{ github.event.inputs.version }}".Trim()
        # 校验版本号格式：x.y 或 x.y.z
        if ($version -notmatch '^\d+\.\d+(\.\d+)?$') {
          throw "版本号格式无效，应为 x.y 或 x.y.z（如 1.1.14），实际为: $version"
        }
        $tag = "v${version}"
        Write-Host "将创建 tag: $tag"
        "tag=$tag" >> $env:GITHUB_OUTPUT
        "version=$version" >> $env:GITHUB_OUTPUT

    - name: 检查 tag 是否已存在
      shell: pwsh
      run: |
        $tag = "${{ steps.tag.outputs.tag }}"
        # 用 git tag -l 的输出判断（总是以 0 退出），避免依赖 git rev-parse 的非零退出码导致步骤误报失败
        if (git tag -l "$tag" | Select-String -Quiet -SimpleMatch "$tag") {
          throw "tag $tag 已存在，请使用新的版本号"
        }
        Write-Host "tag $tag 不存在，可以创建"

    - name: 同步全部版本号并提交
      shell: pwsh
      env:
        RELEASE_VERSION: ${{ steps.tag.outputs.version }}
      run: |
        $version = $env:RELEASE_VERSION.Trim()
        $updates = @(
          @{ Path = 'source.extension.vsixmanifest'; Pattern = '(<Identity\b[^>]*?Version=")[^"]*(")'; Replacement = '${1}' + $version + '${2}' },
          @{ Path = 'DeepSeek_v4_for_VisualStudioPackage.cs'; Pattern = '(public const string Version = ")[^"]*(")'; Replacement = '${1}' + $version + '${2}' },
          @{ Path = 'README.md'; Pattern = '(badge/VSIX-)[0-9.]+(-success)'; Replacement = '${1}' + $version + '${2}' },
          @{ Path = 'README.zh-CN.md'; Pattern = '(badge/VSIX-)[0-9.]+(-success)'; Replacement = '${1}' + $version + '${2}' },
          @{ Path = 'README.md'; Pattern = '(\|\s*\*\*Version\*\*\s*\|\s*)[0-9][0-9.]*(\s*\|)'; Replacement = '${1}' + $version + '${2}' },
          @{ Path = 'README.zh-CN.md'; Pattern = '(\|\s*\*\*版本\*\*\s*\|\s*)[0-9][0-9.]*(\s*\|)'; Replacement = '${1}' + $version + '${2}' },
          @{ Path = 'benchmark/tasks.sample.json'; Pattern = '("extension_version"\s*:\s*")[^"]*(")'; Replacement = '${1}' + $version + '${2}' }
        )

        foreach ($update in $updates) {
          $content = Get-Content -LiteralPath $update.Path -Raw
          $updated = [regex]::Replace($content, $update.Pattern, $update.Replacement)
          if ($updated -eq $content) {
            Write-Host "$($update.Path) 版本号无需变化"
          } else {
            Set-Content -LiteralPath $update.Path -Value $updated -NoNewline
            Write-Host "$($update.Path) 版本号已更新为 $version"
          }
        }

        # ── 校验：README 版本表格必须同步 ──
        # 徽章与表格是两处独立文本，正则一旦与 Markdown 实际写法漂移就会静默漏改
        # （此前只改了徽章，表格一直停留在旧版本）。这里显式断言，格式变化时让发版失败而不是发出去。
        $readmeChecks = @(
          @{ Path = 'README.md'; Label = 'Version' },
          @{ Path = 'README.zh-CN.md'; Label = '版本' }
        )
        foreach ($check in $readmeChecks) {
          $content = Get-Content -LiteralPath $check.Path -Raw
          $tablePattern = '\*\*' + [regex]::Escape($check.Label) + '\*\*\s*\|\s*' + [regex]::Escape($version) + '\s*\|'
          if ($content -notmatch $tablePattern) {
            throw "$($check.Path) 的版本表格未同步到 $version（请检查表格行格式是否变化）"
          }
          Write-Host "$($check.Path) 版本表格已确认: $version"
        }

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git diff --quiet
        if ($LASTEXITCODE -eq 0) {
          Write-Host "版本号已经是 $version，无需提交"
        } else {
          git add -- source.extension.vsixmanifest DeepSeek_v4_for_VisualStudioPackage.cs README.md README.zh-CN.md benchmark/tasks.sample.json
          git commit -m "chore(release): bump version to $version"
          git push origin "HEAD:master"
          Write-Host "版本号提交已推送到 master"
        }

    - name: 创建并推送 tag
      shell: pwsh
      run: |
        $tag = "${{ steps.tag.outputs.tag }}"
        git tag "$tag"
        git push origin "$tag"
        Write-Host "已推送 tag: $tag"

    - name: 安装 MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: 安装 .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: 还原 NuGet 包
      run: dotnet restore

    - name: 校验 VSIX 版本号
      shell: pwsh
      env:
        RELEASE_VERSION: ${{ steps.tag.outputs.version }}
      run: |
        $content = Get-Content -LiteralPath 'source.extension.vsixmanifest' -Raw
        $expected = 'Version="' + $env:RELEASE_VERSION + '"'
        if (-not $content.Contains($expected)) {
          throw "source.extension.vsixmanifest 未同步到版本 $env:RELEASE_VERSION"
        }
        Write-Host "VSIX 版本号已确认: $env:RELEASE_VERSION"

    # ── 第一次构建：标准版 ──
    - name: 构建标准版 VSIX
      run: msbuild DeepSeek_v4_for_VisualStudio.csproj /t:Build /p:Configuration=Release /p:DeployExtension=false

    - name: 归档标准版 VSIX
      shell: pwsh
      env:
        RELEASE_VERSION: ${{ steps.tag.outputs.version }}
      run: |
        $vsix = Get-ChildItem bin\Release\net472\*.vsix | Select-Object -First 1
        if (-not $vsix) { throw "未找到标准版 VSIX 构建产物" }
        New-Item -ItemType Directory -Force -Path release-assets | Out-Null
        $newName = "DeepSeek_v4_for_VisualStudio-v$($env:RELEASE_VERSION).vsix"
        Move-Item -LiteralPath $vsix.FullName -Destination "release-assets\$newName"
        Write-Host "已归档标准版: $newName"

    # ── 第二次构建：No-Local-OCR 版（同一份源码 + 程序化移除，保证版本号一致）──
    - name: 生成 No-Local-OCR 变体源码
      run: python tools/remove-paddleocr.py

    - name: 清理旧产物并重新还原
      shell: pwsh
      run: |
        # 标准版构建残留的 PaddleOCR/OpenCV 原生 DLL 必须清掉，否则会被第二次打包带进 VSIX
        Remove-Item -Recurse -Force bin,obj -ErrorAction SilentlyContinue
        dotnet restore

    - name: 构建 No-Local-OCR VSIX
      run: msbuild DeepSeek_v4_for_VisualStudio.csproj /t:Build /p:Configuration=Release /p:DeployExtension=false

    - name: 校验并归档 No-Local-OCR VSIX
      shell: pwsh
      env:
        RELEASE_VERSION: ${{ steps.tag.outputs.version }}
      run: |
        $vsix = Get-ChildItem bin\Release\net472\*.vsix | Select-Object -First 1
        if (-not $vsix) { throw "未找到 No-Local-OCR VSIX 构建产物" }

        # 兜底校验：变体包内不允许残留 PaddleOCR/OpenCV 组件
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $zip = [System.IO.Compression.ZipFile]::OpenRead($vsix.FullName)
        try {
          $leftovers = @($zip.Entries | Where-Object { $_.FullName -match '(?i)paddle|opencv' })
          if ($leftovers.Count -gt 0) {
            throw "No-Local-OCR 包内仍残留 PaddleOCR/OpenCV 组件，例如: $($leftovers[0].FullName)"
          }
        } finally {
          $zip.Dispose()
        }

        $newName = "DeepSeek_v4_for_VisualStudio-v$($env:RELEASE_VERSION)-No-Local-OCR.vsix"
        Move-Item -LiteralPath $vsix.FullName -Destination "release-assets\$newName"
        Write-Host "已归档 No-Local-OCR 版: $newName"

    - name: '处理版本描述（\n 还原为换行）'
      id: release_notes
      shell: pwsh
      env:
        RELEASE_DESCRIPTION: ${{ github.event.inputs.release_description }}
      run: |
        # GitHub 的 workflow_dispatch 输入框是单行文本框，浏览器会剥离粘贴内容中的换行符，
        # 因此约定用字面量 \n 表示换行，这里统一还原为真实换行后写入多行 output。
        $desc = [string]$env:RELEASE_DESCRIPTION
        $desc = $desc.Trim() -replace '\\n', "`n"
        if ($desc) {
          # 多行值必须使用 heredoc 语法写入 GITHUB_OUTPUT（delimiter 需唯一）
          $delimiter = "RELEASE_BODY_$([guid]::NewGuid().ToString('N'))"
          "body<<$delimiter" >> $env:GITHUB_OUTPUT
          $desc >> $env:GITHUB_OUTPUT
          $delimiter >> $env:GITHUB_OUTPUT
          $lineCount = ($desc -split "`n").Count
          Write-Host "版本描述已还原：$lineCount 行"
        } else {
          Write-Host "版本描述为空，仅使用自动生成的更新日志"
        }

    - name: 发布 Release 并上传两个 VSIX
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        body: ${{ steps.release_notes.outputs.body }}
        files: release-assets/*.vsix
        generate_release_notes: true
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
