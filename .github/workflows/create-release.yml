name: Create Release (手动发版)

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不含 v 前缀，例如 1.1.14）'
        required: true
        type: string
      variant:
        description: '发布版本类型'
        required: true
        type: choice
        default: 'standard'
        options:
          - standard
          - no-local-ocr
      release_description:
        description: '版本描述（可选，将显示在 Release 说明开头；留空则仅显示自动生成的更新日志）。注意：GitHub 输入框不支持多行，请用字面量 \n 表示换行，例如：修复了A\n新增了B'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
    - name: 检出目标分支
      uses: actions/checkout@v4
      with:
        # 根据发布类型选择分支：标准版用 master，无 OCR 版用 no-local-paddleocr
        ref: ${{ github.event.inputs.variant == 'no-local-ocr' && 'no-local-paddleocr' || 'master' }}
        fetch-depth: 0

    - name: 计算 tag 名称
      id: tag
      shell: pwsh
      run: |
        $version = "${{ github.event.inputs.version }}".Trim()
        # 校验版本号格式：x.y 或 x.y.z
        if ($version -notmatch '^\d+\.\d+(\.\d+)?$') {
          throw "版本号格式无效，应为 x.y 或 x.y.z（如 1.1.14），实际为: $version"
        }
        $variant = "${{ github.event.inputs.variant }}"
        $tag = if ($variant -eq 'no-local-ocr') { "v${version}-No-Local-OCR" } else { "v${version}" }
        Write-Host "将创建 tag: $tag"
        "tag=$tag" >> $env:GITHUB_OUTPUT
        "version=$version" >> $env:GITHUB_OUTPUT

    - name: 检查 tag 是否已存在
      shell: pwsh
      run: |
        $tag = "${{ steps.tag.outputs.tag }}"
        # 用 git tag -l 的输出判断（总是以 0 退出），避免依赖 git rev-parse 的非零退出码导致步骤误报失败
        if (git tag -l "$tag" | Select-String -Quiet -SimpleMatch "$tag") {
          throw "tag $tag 已存在，请使用新的版本号"
        }
        Write-Host "tag $tag 不存在，可以创建"

    - name: 同步全部版本号并提交
      shell: pwsh
      env:
        RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        TARGET_BRANCH: ${{ github.event.inputs.variant == 'no-local-ocr' && 'no-local-paddleocr' || 'master' }}
      run: |
        $version = $env:RELEASE_VERSION.Trim()
        $updates = @(
          @{ Path = 'source.extension.vsixmanifest'; Pattern = '(<Identity\b[^>]*?Version=")[^"]*(")'; Replacement = '${1}' + $version + '${2}' },
          @{ Path = 'DeepSeek_v4_for_VisualStudioPackage.cs'; Pattern = '(public const string Version = ")[^"]*(")'; Replacement = '${1}' + $version + '${2}' },
          @{ Path = 'README.md'; Pattern = '(version-)[0-9.]+(-blue)'; Replacement = '${1}' + $version + '${2}' },
          @{ Path = 'README.zh-CN.md'; Pattern = '(version-)[0-9.]+(-blue)'; Replacement = '${1}' + $version + '${2}' },
          @{ Path = 'benchmark/tasks.sample.json'; Pattern = '("extension_version"\s*:\s*")[^"]*(")'; Replacement = '${1}' + $version + '${2}' }
        )

        foreach ($update in $updates) {
          $content = Get-Content -LiteralPath $update.Path -Raw
          $updated = [regex]::Replace($content, $update.Pattern, $update.Replacement)
          if ($updated -eq $content) {
            Write-Host "$($update.Path) 版本号无需变化"
          } else {
            Set-Content -LiteralPath $update.Path -Value $updated -NoNewline
            Write-Host "$($update.Path) 版本号已更新为 $version"
          }
        }

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git diff --quiet
        if ($LASTEXITCODE -eq 0) {
          Write-Host "版本号已经是 $version，无需提交"
        } else {
          git add -- source.extension.vsixmanifest DeepSeek_v4_for_VisualStudioPackage.cs README.md README.zh-CN.md benchmark/tasks.sample.json
          git commit -m "chore(release): bump version to $version"
          git push origin "HEAD:$env:TARGET_BRANCH"
          Write-Host "版本号提交已推送到 $env:TARGET_BRANCH"
        }

    - name: 创建并推送 tag
      shell: pwsh
      run: |
        $tag = "${{ steps.tag.outputs.tag }}"
        git tag "$tag"
        git push origin "$tag"
        Write-Host "已推送 tag: $tag"

    - name: 安装 MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: 安装 .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: 还原 NuGet 包
      run: dotnet restore

    - name: 校验 VSIX 版本号
      shell: pwsh
      env:
        RELEASE_VERSION: ${{ steps.tag.outputs.version }}
      run: |
        $content = Get-Content -LiteralPath 'source.extension.vsixmanifest' -Raw
        $expected = 'Version="' + $env:RELEASE_VERSION + '"'
        if (-not $content.Contains($expected)) {
          throw "source.extension.vsixmanifest 未同步到版本 $env:RELEASE_VERSION"
        }
        Write-Host "VSIX 版本号已确认: $env:RELEASE_VERSION"

    - name: 构建 VSIX
      run: msbuild DeepSeek_v4_for_VisualStudio.csproj /t:Build /p:Configuration=Release /p:DeployExtension=false

    - name: 重命名 VSIX（含版本号）
      shell: pwsh
      run: |
        $tag = "${{ steps.tag.outputs.tag }}"
        $version = $tag -replace '^v', ''
        $vsix = Get-ChildItem bin\Release\net472\*.vsix | Select-Object -First 1
        $newName = "DeepSeek_v4_for_VisualStudio-v$version.vsix"
        Rename-Item $vsix.FullName $newName
        Write-Host "已重命名为: $newName"

    - name: '处理版本描述（\n 还原为换行）'
      id: release_notes
      shell: pwsh
      env:
        RELEASE_DESCRIPTION: ${{ github.event.inputs.release_description }}
      run: |
        # GitHub 的 workflow_dispatch 输入框是单行文本框，浏览器会剥离粘贴内容中的换行符，
        # 因此约定用字面量 \n 表示换行，这里统一还原为真实换行后写入多行 output。
        $desc = [string]$env:RELEASE_DESCRIPTION
        $desc = $desc.Trim() -replace '\\n', "`n"
        if ($desc) {
          # 多行值必须使用 heredoc 语法写入 GITHUB_OUTPUT（delimiter 需唯一）
          $delimiter = "RELEASE_BODY_$([guid]::NewGuid().ToString('N'))"
          "body<<$delimiter" >> $env:GITHUB_OUTPUT
          $desc >> $env:GITHUB_OUTPUT
          $delimiter >> $env:GITHUB_OUTPUT
          $lineCount = ($desc -split "`n").Count
          Write-Host "版本描述已还原：$lineCount 行"
        } else {
          Write-Host "版本描述为空，仅使用自动生成的更新日志"
        }

    - name: 发布 Release 并上传 VSIX
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        body: ${{ steps.release_notes.outputs.body }}
        files: bin/Release/net472/*.vsix
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
