name: Build & Test

on:
  # master 的改动通过 PR 校验合并引用；不再监听 master push，
  # 避免 dev -> master 合并后重复执行同一套构建与测试。
  push:
    branches: [ dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # 前端资源校验：必须先在 Build 之前完成，否则 LangVersion 14 在 dotnet 8 SDK 下
    # 构建失败时，后续步骤会被整体跳过，node 校验就永远跑不到。
    # check-web-assets.ps1 在检测不到 node 时会降级为警告并 exit 0，
    # 因此这里必须显式安装 Node，校验才会真正生效。
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Web Asset Guard (node --check / BOM / placeholder pairing)
      run: powershell -NoProfile -File tools\check-web-assets.ps1

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore NuGet packages
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test with Coverage
      run: >
        dotnet test DeepSeek_v4_for_VisualStudio.Tests\DeepSeek_v4_for_VisualStudio.Tests.csproj
        --no-build --configuration Release
        /p:CollectCoverage=true
        /p:CoverletOutputFormat=cobertura
        /p:CoverletOutput=TestResults\coverage.cobertura.xml

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: DeepSeek_v4_for_VisualStudio.Tests\TestResults\coverage.cobertura.xml

    - name: CJK String Literal Guard (report only)
      run: powershell -File tools\check-cjk-strings.ps1
